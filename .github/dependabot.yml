version: 2
updates:
  # Keep CI actions pinned and current (A2). Because actions are pinned to
  # commit SHAs, Dependabot bumps the SHA while keeping the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  # Surface stale / drifting Gradle dependencies (A11).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
